<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kaç gün kaldı?</title>
<meta name="theme-color" content="#151a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaç gün kaldı?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1330; --bg2:#151a3a; --card:#1b2150; --card2:#222a63;
  --ink:#eef0ff; --muted:#9aa3d4; --faint:#6b74ad; --line:#2d3675;
  --accent:#5b6cff; --accent2:#7c8aff; --sand:#ffaa4d;
  --ok:#36d399; --warn:#ffb020; --soon:#ff7a7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:linear-gradient(180deg,#0f1330,#121734 40%,#0f1330);min-height:100vh;color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:26px 18px 90px}

/* header */
.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#5b6cff,#4453d6);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(91,108,255,.35)}
.logo svg{display:block}
.head h1{font-family:"Sora",sans-serif;font-size:21px;font-weight:700;margin:0;letter-spacing:-.4px}
.head .sub{color:var(--muted);font-size:12.5px;margin:1px 0 0}

/* add form */
.adder{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:22px}
.adder .row{display:flex;gap:10px}
.adder input[type=text]{flex:1;min-width:0}
.adder input{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font-family:inherit;font-size:16px;padding:12px 14px}
.adder input::placeholder{color:var(--faint)}
.adder input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,108,255,.22)}
.adder input[type=date]{width:100%;margin-top:10px;color-scheme:dark}
.swatches{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;position:relative}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg2),0 0 0 4px currentColor}
.add-btn{margin-top:14px;width:100%;background:linear-gradient(135deg,var(--accent),#4857e0);color:#fff;border:none;
  border-radius:13px;font-family:"Sora",sans-serif;font-weight:600;font-size:16px;padding:14px;cursor:pointer;
  transition:transform .05s,filter .15s}
.add-btn:hover{filter:brightness(1.08)}
.add-btn:active{transform:translateY(1px)}

/* list */
.list{display:flex;flex-direction:column;gap:12px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;
  display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dot,var(--accent))}
.ev .big{flex:0 0 auto;text-align:center;min-width:62px}
.ev .num{font-family:"Sora",sans-serif;font-size:30px;font-weight:700;line-height:1;letter-spacing:-1px}
.ev .unit{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.ev .mid{flex:1;min-width:0}
.ev .name{font-family:"Sora",sans-serif;font-weight:600;font-size:16px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .date{color:var(--muted);font-size:13px;margin-top:3px}
.ev .today{color:var(--sand)!important}
.ev .del{flex:0 0 auto;background:none;border:none;color:var(--faint);cursor:pointer;padding:8px;border-radius:9px;
  font-size:18px;line-height:1;transition:color .15s,background .15s}
.ev .del:hover{color:var(--soon);background:rgba(255,122,122,.12)}

.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;
  background:var(--dot,var(--accent));color:#fff;margin-top:5px;opacity:.92}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14.5px;line-height:1.7}
.empty .ico{font-size:40px;display:block;margin-bottom:10px;opacity:.5}

/* past section */
.pastwrap{margin-top:26px}
.pastwrap summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600;
  list-style:none;display:flex;align-items:center;gap:8px;padding:8px 2px;user-select:none}
.pastwrap summary::-webkit-details-marker{display:none}
.pastwrap summary .arw{transition:transform .2s;font-size:11px}
.pastwrap[open] summary .arw{transform:rotate(90deg)}
.pastwrap .list{margin-top:10px;opacity:.72}
.ev.past .num{font-size:22px;color:var(--faint)}
.ev.past{padding:12px 14px}

/* footer actions */
.tools{margin-top:34px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tools button{background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:11px;
  font-family:inherit;font-size:13px;font-weight:500;padding:10px 16px;cursor:pointer;transition:border-color .15s,color .15s}
.tools button:hover{border-color:var(--accent);color:var(--ink)}
.foot{margin-top:22px;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.6}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 3h12M6 21h12M7 3c0 5 10 6 10 9s-10 4-10 9M17 3c0 5-10 6-10 9s10 4 10 9"
          stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.5 18.2c0-1.4 2.5-2.2 2.5-2.2s2.5.8 2.5 2.2" fill="#ffaa4d"/>
      </svg>
    </span>
    <div>
      <h1>Kaç gün kaldı?</h1>
      <p class="sub">Etkinliklerine kalan günler</p>
    </div>
  </div>

  <div class="adder">
    <div class="row">
      <input type="text" id="name" placeholder="Olay adı (ör. Uzmanlık sınavı)" maxlength="60" autocomplete="off">
    </div>
    <input type="date" id="date">
    <div class="swatches" id="swatches"></div>
    <button class="add-btn" id="add">+ Ekle</button>
  </div>

  <div class="list" id="list"></div>

  <details class="pastwrap" id="pastwrap" style="display:none">
    <summary><span class="arw">▶</span> Geçmiş olaylar (<span id="pastcount">0</span>)</summary>
    <div class="list" id="pastlist"></div>
  </details>

  <div class="tools">
    <button id="backup">↓ Yedekle</button>
    <button id="restore">↑ Geri yükle</button>
    <input type="file" id="file" accept="application/json,.json">
  </div>
  <p class="foot">Veriler yalnızca bu cihazda saklanır.<br>Ana ekrana ekleyerek uygulama gibi kullanabilirsin.</p>
</div>

<script>
const PALETTE=["#5b6cff","#36d399","#ffaa4d","#ff7a7a","#c084fc","#22d3ee","#f472b6","#a3e635"];
const KEY="kgk.events.v1";
let events=[
 {"id":"a1","name":"Uzmanlık sınavı","date":"2026-11-20","color":"#5b6cff"},
 {"id":"a2","name":"Kongre sunumu","date":"2026-10-13","color":"#ffaa4d"},
 {"id":"a3","name":"Yıllık izin başlangıcı","date":"2026-12-01","color":"#36d399"},
 {"id":"a4","name":"Bugünkü toplantı","date":"2026-10-12","color":"#ff7a7a"},
 {"id":"a5","name":"Geçen haftaki vize","date":"2026-10-05","color":"#c084fc"}
];
let picked=PALETTE[0];

const $=id=>document.getElementById(id);

function load(){
  try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):[]}catch(e){return []}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// gün farkı (yerel gece yarısına göre)
function daysLeft(dstr){
  const now=new Date(); const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const p=dstr.split("-"); const t1=new Date(+p[0],+p[1]-1,+p[2]);
  return Math.round((t1-t0)/86400000);
}
function fmtDate(dstr){
  const p=dstr.split("-"); const d=new Date(+p[0],+p[1]-1,+p[2]);
  const days=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  const mon=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
  return `${d.getDate()} ${mon[d.getMonth()]} ${d.getFullYear()} · ${days[d.getDay()]}`;
}

function buildSwatches(){
  const w=$("swatches"); w.innerHTML="";
  PALETTE.forEach(c=>{
    const s=document.createElement("div");
    s.className="sw"+(c===picked?" on":""); s.style.background=c; s.style.color=c;
    s.onclick=()=>{picked=c;buildSwatches()};
    w.appendChild(s);
  });
}

function render(){
  const upcoming=events.filter(e=>daysLeft(e.date)>=0).sort((a,b)=>daysLeft(a.date)-daysLeft(b.date));
  const past=events.filter(e=>daysLeft(e.date)<0).sort((a,b)=>daysLeft(b.date)-daysLeft(a.date));

  const list=$("list"); list.innerHTML="";
  if(upcoming.length===0){
    list.innerHTML='<div class="empty"><span class="ico">⏳</span>Henüz olay yok.<br>Yukarıdan bir olay ve tarih ekle.</div>';
  }else{
    upcoming.forEach(e=>list.appendChild(card(e,false)));
  }

  const pw=$("pastwrap"), pl=$("pastlist");
  if(past.length){
    pw.style.display="block"; $("pastcount").textContent=past.length;
    pl.innerHTML=""; past.forEach(e=>pl.appendChild(card(e,true)));
  }else{ pw.style.display="none"; }
}

function card(e,isPast){
  const n=daysLeft(e.date);
  const el=document.createElement("div");
  el.className="ev"+(isPast?" past":"");
  el.style.setProperty("--dot",e.color||"#5b6cff");

  let numHtml,unit;
  if(isPast){ numHtml=Math.abs(n); unit="gün önce"; }
  else if(n===0){ numHtml='<span class="today">●</span>'; unit=""; }
  else{ numHtml=n; unit="gün kaldı"; }

  const big=document.createElement("div"); big.className="big";
  if(n===0&&!isPast){
    big.innerHTML='<div class="num today" style="font-size:19px">BUGÜN</div>';
  }else{
    big.innerHTML=`<div class="num">${numHtml}</div><div class="unit">${unit}</div>`;
  }

  const mid=document.createElement("div"); mid.className="mid";
  let label="";
  if(!isPast){
    if(n===0)label='<span class="date today">Bugün!</span>';
    else if(n===1)label='<span class="date">Yarın</span>';
    else label=`<span class="date">${fmtDate(e.date)}</span>`;
  }else{
    label=`<span class="date">${fmtDate(e.date)}</span>`;
  }
  mid.innerHTML=`<p class="name">${esc(e.name)}</p>${label}`;

  const del=document.createElement("button"); del.className="del"; del.innerHTML="✕"; del.title="Sil";
  del.onclick=()=>{ if(confirm(`"${e.name}" silinsin mi?`)){ events=events.filter(x=>x.id!==e.id); save(); render(); } };

  el.append(big,mid,del);
  return el;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

$("add").onclick=()=>{
  const name=$("name").value.trim(); const date=$("date").value;
  if(!name){ $("name").focus(); return; }
  if(!date){ $("date").focus(); return; }
  events.push({id:uid(),name,date,color:picked});
  save(); render();
  $("name").value=""; $("date").value=""; $("name").focus();
};
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")$("date").focus()});

// yedekleme
$("backup").onclick=()=>{
  const blob=new Blob([JSON.stringify(events,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="kacgunkaldi-yedek-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("restore").onclick=()=>$("file").click();
$("file").onchange=ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!Array.isArray(data))throw 0;
      const clean=data.filter(x=>x&&x.name&&x.date).map(x=>({id:x.id||uid(),name:String(x.name),date:x.date,color:x.color||"#5b6cff"}));
      if(confirm(`${clean.length} olay geri yüklensin mi? Mevcut liste değişecek.`)){
        events=clean; save(); render();
      }
    }catch(e){ alert("Dosya okunamadı."); }
    ev.target.value="";
  };
  r.readAsText(f);
};

buildSwatches();
render();

if(false){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
